name: deploy website
on:
  workflow_dispatch:
    inputs:
      ref:
        description: branch|tag|SHA to checkout
        default: "main"
        required: true

  schedule:
    # 毎日 01:17 / 13:17 UTC に Cosense から再フェッチして再デプロイ
    # (schedule はデフォルトブランチ main でのみ発火する)
    - cron: "17 1,13 * * *"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || 'main' }}
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm

      - name: Restore Cosense cache
        uses: actions/cache@v4
        with:
          path: .cosense-cache
          key: cosense-cache-${{ github.ref }}
          restore-keys: |
            cosense-cache-

      - name: Install dependencies
        run: npm ci

      - name: Fetch Cosense pages
        run: npx cosense-site fetch

      - name: Build
        run: npx astro build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@1
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          projectName: ogurilab-org
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: main
