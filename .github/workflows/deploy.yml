name: deploy website
on:
  workflow_dispatch:
    inputs:
      ref:
        description: branch|tag|SHA to checkout
        default: "main"
        required: true

      skip_doctor:
        description: 公開前ゲート (doctor) を飛ばして公開する
        type: boolean
        default: false

  schedule:
    # 15 分ごとに起動し、check ジョブが変更を検知したときだけビルド・公開する
    # (schedule はデフォルトブランチ main でのみ発火する)。毎時 0 分は GitHub 全体で
    # 混み合い遅延・取りこぼしが出やすいので外してある。
    - cron: "7,22,37,52 * * * *"

# 公開は重ねて走らせない。走っている公開は途中で止めず、後続は待たせる
# (待ちは最新の 1 件だけ残り、それより古い待ちは GitHub が捨てる)。
concurrency:
  group: deploy-website
  cancel-in-progress: false

jobs:
  # 空振りのビルドを省くための安い事前判定。更新頻度は低いので、15 分ごとの起動の
  # ほとんどはここだけで終わる。判定に使う指紋は次の 3 つを連結したもの:
  #
  # - UTC の日付 — 変更が無くても 1 日 1 回は必ず公開まで走らせる。下の
  #   heartbeat ステップは deploy ジョブの中にあるので、これが無いと無更新が
  #   60 日続いたときに稼働記録コミットが生まれず cron が止まる (ADR 0003)。
  #   指紋で拾えない変化 (Cosense のアイコン差し替えなど) の取りこぼしも 1 日で埋まる
  # - main の commit SHA — theme/ などのコード変更。push では公開しないので、
  #   これを入れないとコード変更が翌日まで出ない
  # - Cosense の総ページ数と最終更新時刻 — 記事の編集・#publish の付け外し (編集
  #   扱いで更新時刻が進む)・ページ削除 (総数が減る) を拾う
  #
  # 公開済みの指紋は actions/cache に空に近いエントリとして記録し、ここでは有無だけを
  # 見る。キャッシュは 7 日使われないと消えるが、消えても 1 回余分に公開するだけ。
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.decide.outputs.changed }}
      fingerprint: ${{ steps.fingerprint.outputs.value }}
    steps:
      - name: Compute fingerprint
        id: fingerprint
        env:
          # cosense.config.ts の source.project と揃える
          COSENSE_PROJECT: dclab
        run: |
          # sort=updated はピン留めページを先頭に返すので、1 件目ではなく先頭 100 件の
          # 最大値を取る (ピン留めが 99 件を超えない限りこれで全体の最大値になる)
          if ! res=$(curl -fsS --retry 3 --max-time 30 \
              "https://scrapbox.io/api/pages/${COSENSE_PROJECT}?sort=updated&limit=100"); then
            # 判定できないときは従来どおり公開まで走らせる (止まるより空振りのほうがよい)
            echo "::warning::Cosense の更新状況を取得できなかったため、変更ありとして扱う"
            exit 0
          fi
          cosense=$(jq -r '"\(.count)-\([.pages[].updated] | max)"' <<<"$res")
          value="$(date -u +%F)-${GITHUB_SHA::12}-${cosense}"
          echo "fingerprint: $value"
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Look up the deployed fingerprint
        id: lookup
        if: github.event_name == 'schedule' && steps.fingerprint.outputs.value != ''
        uses: actions/cache/restore@v6
        with:
          path: .deploy-marker
          key: deployed-${{ steps.fingerprint.outputs.value }}
          lookup-only: true

      # 手動実行は常に公開する (判定は schedule 起動のときだけ)
      - name: Decide
        id: decide
        env:
          HIT: ${{ steps.lookup.outputs.cache-hit }}
        run: |
          if [ "$HIT" = "true" ]; then
            echo "前回の公開から変更なし。今回はビルドしない。"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      # contents: write — 稼働記録のコミットに必要 (下の heartbeat ステップ)
      contents: write
      deployments: write
      # issues: write — 公開が止まったときの起票に必要 (下の report ステップ)
      issues: write
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || 'main' }}
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: npm

      - name: Restore Cosense cache
        uses: actions/cache@v6
        with:
          path: .cosense-cache
          key: cosense-cache-${{ github.ref }}
          restore-keys: |
            cosense-cache-

      - name: Install dependencies
        run: npm ci

      - name: Fetch Cosense pages
        run: npx cosense-site fetch

      - name: Build
        run: npx astro build

      # GitHub は「リポジトリに 60 日間アクティビティが無い」とスケジュール実行を
      # 自動で無効化する。ワークフローの実行自体は活動に数えられない。このサイトは
      # コンテンツを Cosense に置くためコミットが生まれず、放っておくと cron が
      # 止まる (実際に 292 日間止まっていた)。そこで月に一度だけ記録ファイルを
      # 更新してコミットし、リポジトリを活動状態に保つ。
      #
      # publish ステップより前に置いてある。wrangler-action は wrangler 本体を
      # ワークツリーへ入れて package.json / package-lock.json を汚すため、後ろに
      # 置くとそれを巻き込む。念のため add もファイル名で明示している。
      - name: Keep the schedule alive
        if: github.event.inputs.ref == '' || github.event.inputs.ref == 'main'
        # 付随的な処理なので、失敗しても公開を止めない
        continue-on-error: true
        run: |
          month=$(date -u +%Y-%m)
          pages=$(find dist -name index.html | wc -l | tr -d ' ')
          printf '{\n  "heartbeat": "%s",\n  "builtPages": %s\n}\n' "$month" "$pages" > .github/last-deploy.json
          if git diff --quiet -- .github/last-deploy.json; then
            echo "今月分は記録済み。コミットしない。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-deploy.json
          git commit -m "chore: 稼働記録を更新する ($month) [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      # 公開前ゲート。fail 条件 (公開 0 件・.site の code:site.yaml がパース失敗・
      # nav / home の参照切れ・slug 衝突) はどれも「今 live のサイトより悪いものを出す」
      # 状態にあたる。ここで止めても publish が走らないだけで、Cloudflare Pages は
      # 直前のデプロイを配信し続ける — 起きるのは「サイトが消える」ではなく
      # 「昨日のサイトが据え置かれる」。Cosense 側を直せば次の cron で自動的に復帰する。
      #
      # heartbeat より後・publish より前に置いてある。前に置くと、ゲートが落ち続けて
      # いる間ずっと稼働記録のコミットが生まれず、60 日で cron が自動停止する
      # (このリポが 292 日止まったのと同じ経路)。build 1 回ぶんを捨てる代わりに、
      # 公開が止まっている間も cron は生かしておく。
      #
      # warn 止まりの項目 (broken link) は exit code に影響しないのでゲートに入らない。
      # PR 側 (ci.yml) の doctor は continue-on-error のまま。あちらの fail 条件は
      # コード変更と独立に赤くなるが、ここは公開しようとしている中身そのものの問題になる。
      #
      # schedule 起動では inputs が空なので skip_doctor は null 扱いになり、必ず走る。
      - name: Doctor
        id: doctor
        if: ${{ !inputs.skip_doctor }}
        run: npx cosense-site doctor

      # cloudflare/pages-action はアーカイブ済み。後継の wrangler-action で
      # `wrangler pages deploy` を実行する。gitHubToken を渡すと pages-action と
      # 同じく GitHub Deployments が作られる (job の deployments: write が必要)。
      #
      # --commit-dirty=true: wrangler-action は wrangler 自体を
      # `npm i wrangler@4` でこのワークツリーへ入れるため package.json /
      # package-lock.json に差分が出て、毎回 dirty 警告が出る。公開物には影響しない。
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy dist --project-name=ogurilab-org --branch=main --commit-dirty=true

      # ゲートで止まったことに気付けるようにする。このワークフローの失敗メールは
      # cron を最後に編集した人にしか飛ばず埋もれやすいので、リポジトリ側に残す。
      # open な起票が既にあれば何もしないため、直すまで失敗のたびに増えたりはしない
      # (裏返しに、直したら close しないと次の失敗が起票されない)。
      - name: Report the stopped publish
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DOCTOR_OUTCOME: ${{ steps.doctor.outcome }}
        run: |
          gh label create deploy-blocked --force --color B60205 \
            --description "自動デプロイが失敗して公開が止まっている"
          existing=$(gh issue list --state open --label deploy-blocked --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "既に #$existing で起票済み。重ねて起票しない。"
            exit 0
          fi
          if [ "$DOCTOR_OUTCOME" = "failure" ]; then
            cause="公開前ゲート (\`cosense-site doctor\`) が fail を返したため、公開を止めました。Cosense 側の内容を直せば、次の cron で自動的に復帰します。"
          else
            cause="doctor 以外のステップが失敗したため、公開まで到達しませんでした。"
          fi
          cat > "$RUNNER_TEMP/body.md" <<MD
          $cause

          - 失敗した run: $RUN_URL
          - サイトは直前のデプロイをそのまま配信し続けています (巻き戻ってはいません)
          - 直したらこの Issue を close してください

          承知のうえで公開したい場合は、deploy website を \`skip_doctor: true\` 付きで手動実行してください。
          MD
          gh issue create --title "deploy: 自動デプロイが失敗して公開が止まっています" \
            --label deploy-blocked --body-file "$RUNNER_TEMP/body.md"

      # 公開した指紋を記録し、同じ内容での再ビルドを次の check で省かせる。doctor で
      # 止まった場合も記録する — 内容が同じならやり直しても同じ結果になるので、
      # Cosense 側が直る (= 指紋が変わる) まで 15 分ごとに捨てるビルドを回さない。
      # それ以外の失敗 (ネットワーク等) は一過性かもしれないので記録せず、次で再試行する。
      # main 以外の ref を手動で公開したときは main の指紋と一致しないので記録しない。
      - name: Prepare the deployed marker
        id: marker
        if: >-
          !cancelled()
          && needs.check.outputs.fingerprint != ''
          && (github.event.inputs.ref == '' || github.event.inputs.ref == 'main')
          && (success() || steps.doctor.outcome == 'failure')
        env:
          FINGERPRINT: ${{ needs.check.outputs.fingerprint }}
        run: |
          mkdir -p .deploy-marker
          echo "$FINGERPRINT" > .deploy-marker/fingerprint

      - name: Record the deployed fingerprint
        if: ${{ !cancelled() && steps.marker.outcome == 'success' }}
        # 付随的な処理なので、失敗しても run を赤くしない (次の check で 1 回余分に公開するだけ)
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .deploy-marker
          key: deployed-${{ needs.check.outputs.fingerprint }}
